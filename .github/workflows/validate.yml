name: Beta-Quellcode prüfen
on:
  push:
    branches: [Root]
  pull_request:
    branches: [Root]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Manifest / Navigation / Offline-Cache prüfen
        run: node --test tests/*.test.mjs
